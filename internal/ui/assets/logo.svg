<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <style>
      .chip-color { fill: #5BB82F; }
      .chip-stroke { stroke: #5BB82F; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- ==================== 1. 四周芯片引脚 (共20支) ==================== -->
  <g class="chip-color">
    <!-- 顶部 5 支引脚 -->
    <rect x="222" y="28" width="60" height="180" rx="30" />
    <rect x="352" y="28" width="60" height="180" rx="30" />
    <rect x="482" y="28" width="60" height="180" rx="30" />
    <rect x="612" y="28" width="60" height="180" rx="30" />
    <rect x="742" y="28" width="60" height="180" rx="30" />

    <!-- 底部 5 支引脚 -->
    <rect x="222" y="816" width="60" height="180" rx="30" />
    <rect x="352" y="816" width="60" height="180" rx="30" />
    <rect x="482" y="816" width="60" height="180" rx="30" />
    <rect x="612" y="816" width="60" height="180" rx="30" />
    <rect x="742" y="816" width="60" height="180" rx="30" />

    <!-- 左侧 5 支引脚 -->
    <rect x="28" y="222" width="180" height="60" rx="30" />
    <rect x="28" y="352" width="180" height="60" rx="30" />
    <rect x="28" y="482" width="180" height="60" rx="30" />
    <rect x="28" y="612" width="180" height="60" rx="30" />
    <rect x="28" y="742" width="180" height="60" rx="30" />

    <!-- 右侧 5 支引脚 -->
    <rect x="816" y="222" width="180" height="60" rx="30" />
    <rect x="816" y="352" width="180" height="60" rx="30" />
    <rect x="816" y="482" width="180" height="60" rx="30" />
    <rect x="816" y="612" width="180" height="60" rx="30" />
    <rect x="816" y="742" width="180" height="60" rx="30" />
  </g>

  <!-- ==================== 2. 芯片主体外框 ==================== -->
  <!-- 绿色倒角外壳 -->
  <polygon class="chip-color" points="
    256,156 768,156 868,256 868,768 768,868 256,868 156,768 156,256
  " />

  <!-- 内部白色倒角衬底 -->
  <polygon fill="#FFFFFF" points="
    276,216 748,216 808,276 808,748 748,808 276,808 216,748 216,276
  " />

  <!-- ==================== 3. 核心图案：无限符号 + 气泡尾巴 ==================== -->
  <g class="chip-color">
    <!-- 无限符号主环 (加大内部孔径，左右对称，左环心约370，右环心约654) -->
    <path fill-rule="evenodd" d="
      M 370,366
      C 434,366 480,432 512,476
      C 544,432 590,366 654,366
      C 736,366 786,430 786,512
      C 786,594 736,658 654,658
      C 590,658 544,592 512,548
      C 480,592 434,658 370,658
      C 288,658 238,594 238,512
      C 238,430 288,366 370,366 Z

      M 370,418
      C 318,418 288,460 288,512
      C 288,564 318,606 370,606
      C 416,606 448,558 474,512
      C 448,466 416,418 370,418 Z

      M 654,418
      C 608,418 576,466 550,512
      C 576,558 608,606 654,606
      C 706,606 736,564 736,512
      C 736,460 706,418 654,418 Z
    " />

    <!-- 左侧对话小气泡尾巴 (贴合左环外缘朝左下) -->
    <path d="M 284,575 L 244,625 C 238,632 247,641 255,635 L 314,608 Z" />

    <!-- 右侧对话小气泡尾巴 (贴合右环外缘朝右上) -->
    <path d="M 740,449 L 780,399 C 786,392 777,383 769,389 L 710,416 Z" />
  </g>

  <!-- ==================== 4. 居中字符 (A 与 文) ==================== -->
  <!-- 左环中心：字符 “A” (精确居中于 (370, 512)，四边完全不触碰环壁) -->
  <g class="chip-color" transform="translate(370, 512)">
    <!-- 字母 A 外轮廓及内孔镂空 -->
    <path fill-rule="evenodd" d="
      M -15,-58 C -7,-58 -1,-54 2,-46
      L 38,42 C 41,50 35,58 26,58
      L 15,58 C 9,58 4,54 2,48
      L -4,30
      L -26,30
      L -32,48 C -34,54 -39,58 -45,58
      L -56,58 C -65,58 -71,50 -68,42
      L -32,-46 C -29,-54 -23,-58 -15,-58 Z

      M -15,-22
      L -22,12
      L -8,12 Z
    " />
  </g>

  <!-- 右环中心：字符 “文” (精确居中于 (654, 512)，四边留出充裕空间) -->
  <g class="chip-color" transform="translate(654, 512)">
    <!-- 上方点 -->
    <rect x="-10" y="-56" width="20" height="18" rx="9" />
    <!-- 核心主横 -->
    <rect x="-42" y="-30" width="84" height="17" rx="8.5" />
    <!-- 交叉撇捺 (圆角笔画) -->
    <path class="chip-stroke" stroke-width="17" d="M 19,-8 L -26,44" />
    <path class="chip-stroke" stroke-width="17" d="M -18,-8 L 27,44" />
  </g>
</svg>